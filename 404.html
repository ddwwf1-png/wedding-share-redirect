<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dan & Alice — Room Share</title>
  <style>
    html,body{margin:0;padding:0;width:100%;min-height:100%;background:#f7f6f4}
    body{font-family:Arial,Helvetica,sans-serif}
    iframe{display:block;width:100%;height:100vh;min-height:900px;border:0;background:#fff}
    .fallback{max-width:720px;margin:80px auto;padding:30px;text-align:center}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (function(){
      var accommodation="https://www.danandalice.co.uk/Accommodation";
      var path=(window.location.pathname||"/").replace(/^\/+|\/+$/g,"");
      if(!path){window.location.replace(accommodation);return;}

      var token=path.toUpperCase();
      if(!/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{8}$/.test(token)){
        window.location.replace(accommodation);
        return;
      }

      var src="https://script.google.com/macros/s/AKfycbyP5aMvPN0CKMdxesFovK7GuLSwy-pRDTVFCXi9fmdbS8hmX29DVxYhi8PQamqDa8R8/exec?view=ACCOMMODATION&share="+encodeURIComponent(token);
      var iframe=document.createElement("iframe");
      iframe.title="Dan & Alice room-share invitation";
      iframe.src=src;
      iframe.allow="clipboard-write";
      document.getElementById("app").appendChild(iframe);

      window.addEventListener("message",function(event){
        if(event&&event.data&&event.data.type==="DA_ROOM_SHARE_CONSUMED"){
          window.location.replace(accommodation);
        }
      });
    })();
  </script>
</body>
</html>
