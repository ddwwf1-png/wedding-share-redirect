<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dan & Alice — Room Share</title>
  <script>
    (function(){
      var accommodation="https://www.danandalice.co.uk/Accommodation";
      var path=(window.location.pathname||"/").replace(/^\/+|\/+$/g,"");
      if(!path){window.location.replace(accommodation);return;}
      var token=path.toUpperCase();
      if(!/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{8}$/.test(token)){window.location.replace(accommodation);return;}
      document.cookie="daRoomShare="+encodeURIComponent(token)+"; Max-Age=3600; Domain=danandalice.co.uk; Path=/; Secure; SameSite=Lax";
      window.location.replace(accommodation);
    })();
  </script>
</head>
<body>
  <p>Taking you to Dan & Alice's accommodation page…</p>
</body>
</html>
